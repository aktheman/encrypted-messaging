name: Cross-Platform Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build GUI executable
      run: |
        pyinstaller \
          --name encrypted-messaging-gui \
          --noconsole \
          --clean \
          --hidden-import=crypto \
          --hidden-import=identity \
          --hidden-import=storage \
          --hidden-import=networking \
          --hidden-import=messaging \
          --hidden-import=config \
          --hidden-import=cryptography \
          --hidden-import=cryptography.hazmat.primitives.asymmetric.x25519 \
          --hidden-import=cryptography.hazmat.primitives.asymmetric.ed25519 \
          --hidden-import=cryptography.hazmat.primitives.ciphers.aead \
          --hidden-import=cryptography.hazmat.primitives.kdf.hkdf \
          --hidden-import=cryptography.x509 \
          --hidden-import=cryptography.x509.oid \
          --hidden-import=sqlite3 \
          --hidden-import=json \
          --hidden-import=logging \
          --hidden-import=threading \
          --hidden-import=asyncio \
          --hidden-import=tempfile \
          --hidden-import=shutil \
          --hidden-import=pathlib \
          --hidden-import=typing \
          --hidden-import=datetime \
          --hidden-import=secrets \
          --hidden-import=hashlib \
          --hidden-import=websockets \
          --hidden-import=customtkinter \
          --hidden-import=darkdetect \
          --hidden-import=tkinter \
          --hidden-import=matplotlib \
          --add-data "config.json:." \
          gui.py

    - name: Build TUI executable
      run: |
        pyinstaller \
          --name encrypted-messaging-tui \
          --console \
          --clean \
          --hidden-import=crypto \
          --hidden-import=identity \
          --hidden-import=storage \
          --hidden-import=networking \
          --hidden-import=messaging \
          --hidden-import=config \
          --hidden-import=cryptography \
          --hidden-import=cryptography.hazmat.primitives.asymmetric.x25519 \
          --hidden-import=cryptography.hazmat.primitives.asymmetric.ed25519 \
          --hidden-import=cryptography.hazmat.primitives.ciphers.aead \
          --hidden-import=cryptography.hazmat.primitives.kdf.hkdf \
          --hidden-import=cryptography.x509 \
          --hidden-import=cryptography.x509.oid \
          --hidden-import=sqlite3 \
          --hidden-import=json \
          --hidden-import=logging \
          --hidden-import=threading \
          --hidden-import=asyncio \
          --hidden-import=tempfile \
          --hidden-import=shutil \
          --hidden-import=pathlib \
          --hidden-import=typing \
          --hidden-import=datetime \
          --hidden-import=secrets \
          --hidden-import=hashlib \
          --hidden-import=websockets \
          --hidden-import=textual \
          --hidden-import=textual.widgets._tab_pane \
          --hidden-import=rich \
          --hidden-import=customtkinter \
          --hidden-import=darkdetect \
          --add-data "config.json:." \
          tui.py

    - name: Build Server executable
      run: |
        pyinstaller \
          --name encrypted-messaging-server \
          --console \
          --clean \
          --hidden-import=crypto \
          --hidden-import=identity \
          --hidden-import=storage \
          --hidden-import=networking \
          --hidden-import=messaging \
          --hidden-import=config \
          --hidden-import=cryptography \
          --hidden-import=cryptography.hazmat.primitives.asymmetric.x25519 \
          --hidden-import=cryptography.hazmat.primitives.asymmetric.ed25519 \
          --hidden-import=cryptography.hazmat.primitives.ciphers.aead \
          --hidden-import=cryptography.hazmat.primitives.kdf.hkdf \
          --hidden-import=cryptography.x509 \
          --hidden-import=cryptography.x509.oid \
          --hidden-import=sqlite3 \
          --hidden-import=json \
          --hidden-import=logging \
          --hidden-import=threading \
          --hidden-import=asyncio \
          --hidden-import=tempfile \
          --hidden-import=shutil \
          --hidden-import=pathlib \
          --hidden-import=typing \
          --hidden-import=datetime \
          --hidden-import=secrets \
          --hidden-import=hashlib \
          --hidden-import=websockets \
          --hidden-import=textual \
          --hidden-import=textual.widgets._tab_pane \
          --hidden-import=rich \
          --hidden-import=customtkinter \
          --hidden-import=darkdetect \
          --add-data "config.json:." \
          tui.py

    - name: Test executables
      run: |
        for exe in dist/encrypted-messaging-*/encrypted-messaging-*; do
          if [[ -f "$exe" && -x "$exe" ]]; then
            echo "Testing: $exe --help"
            timeout 10 "$exe" --help 2>&1 | head -5
            echo "  -> OK"
          fi
        done

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Upload artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: encrypted-messaging-windows-${{ matrix.python-version }}
        path: |
          dist/encrypted-messaging-gui/encrypted-messaging-gui.exe
          dist/encrypted-messaging-tui/encrypted-messaging-tui.exe
          dist/encrypted-messaging-server/encrypted-messaging-server.exe
        retention-days: 7

    - name: Upload artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: encrypted-messaging-linux-${{ matrix.python-version }}
        path: |
          dist/encrypted-messaging-gui/encrypted-messaging-gui
          dist/encrypted-messaging-tui/encrypted-messaging-tui
          dist/encrypted-messaging-server/encrypted-messaging-server
        retention-days: 7

    - name: Upload artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: encrypted-messaging-macos-${{ matrix.python-version }}
        path: |
          dist/encrypted-messaging-gui/encrypted-messaging-gui
          dist/encrypted-messaging-tui/encrypted-messaging-tui
          dist/encrypted-messaging-server/encrypted-messaging-server
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/encrypted-messaging-windows-*/encrypted-messaging-gui.exe
          artifacts/encrypted-messaging-windows-*/encrypted-messaging-tui.exe
          artifacts/encrypted-messaging-windows-*/encrypted-messaging-server.exe
          artifacts/encrypted-messaging-linux-*/encrypted-messaging-gui
          artifacts/encrypted-messaging-linux-*/encrypted-messaging-tui
          artifacts/encrypted-messaging-linux-*/encrypted-messaging-server
          artifacts/encrypted-messaging-macos-*/encrypted-messaging-gui
          artifacts/encrypted-messaging-macos-*/encrypted-messaging-tui
          artifacts/encrypted-messaging-macos-*/encrypted-messaging-server
        generate_release_notes: true